<script>
(()=>{const c=document.querySelector('canvas'),x=c.getContext('2d'),hint=document.querySelector('p'),n=F.length;
const playBtn=document.getElementById('play'),views=[...document.querySelectorAll('[data-view]')];
const load=list=>list.map(s=>{const i=new Image();i.src=s;return i});
const studio=load(F);let orig=null;
let set=studio,i=0,pos=0,prevT=0,drag=null,play=n>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
const label=k=>{c.setAttribute('aria-valuenow',k+1);c.setAttribute('aria-valuetext','Frame '+(k+1)+' of '+n)};
const render=(a,fade)=>{const b=(a+1)%n;x.globalAlpha=1;x.drawImage(set[a],0,0,c.width,c.height);
if(fade>.01&&set[b].complete){x.globalAlpha=fade;x.drawImage(set[b],0,0,c.width,c.height);x.globalAlpha=1}};
const show=k=>{i=((k%n)+n)%n;pos=i;if(!set[i].complete)return;render(i,0);label(i)};
const setPlay=on=>{play=on&&n>1;if(playBtn){playBtn.textContent=play?'Pause':'Play';playBtn.setAttribute('aria-pressed',play)}};
const stop=()=>{setPlay(false);hint.style.opacity=0};
// Autoplay holds each view for 60% of its slot and crossfades into the next for the rest:
// smooth motion that hides small uneven steps between hand-turned photos, without double images.
const tick=t=>{if(play&&prevT){pos=(pos+(t-prevT)*n/6000)%n;const a=Math.floor(pos);
if(a!==i){i=a;label(a)}if(set[a].complete)render(a,Math.max(0,(pos-a-0.6)/0.4))}prevT=t;requestAnimationFrame(tick)};
setPlay(play);
studio[0].decode().then(()=>show(0));
Promise.all(studio.map(im=>im.decode())).then(()=>requestAnimationFrame(tick));
c.onpointerdown=e=>{if(e.button||n<2)return;stop();drag={x:e.clientX,i,id:e.pointerId};c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(drag&&e.pointerId===drag.id)show(drag.i-Math.round((e.clientX-drag.x)/(c.clientWidth/n)))};
c.onpointerup=c.onpointercancel=()=>{drag=null};
c.onkeydown=e=>{const t={ArrowRight:i+1,ArrowLeft:i-1,Home:0,End:n-1}[e.key];
if(t!==undefined){e.preventDefault();stop();show(t)}else if(e.key===' '){e.preventDefault();setPlay(!play)}};
if(playBtn)playBtn.onclick=()=>{setPlay(!play);if(!play)hint.style.opacity=0};
const pick=b=>{const want=b.dataset.view==='original';
if(want&&!self.O){b.setAttribute('aria-busy','true');self.onOriginals=()=>{b.removeAttribute('aria-busy');pick(b)};return}
set=want?(orig??=load(self.O)):studio; // originals decode only once asked for
views.forEach(v=>v.setAttribute('aria-pressed',v===b));
if(set[i].complete)show(i);else set[i].decode().then(()=>show(i))};
views.forEach(b=>b.onclick=()=>pick(b));
})();
